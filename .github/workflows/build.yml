name: Build binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            binary: princess
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            binary: princess
          - platform: darwin-x64
            runner: macos-15-intel
            binary: princess
          - platform: darwin-arm64
            runner: macos-15
            binary: princess
          - platform: windows-x64
            runner: windows-2025
            binary: princess.exe
          - platform: windows-arm64
            runner: windows-11-arm
            binary: princess.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build:binary
      - run: bun scripts/smoke-binary.ts build/${{ matrix.binary }}
      - name: Package binary and notices
        shell: bash
        run: |
          cp README.md build/
          cp vendor/explorer/LICENSE.txt build/LICENSE-explorer.txt
          cp vendor/explorer/parsers/LICENSE-tree-sitter build/
          cp vendor/explorer/parsers/LICENSE-python build/
          tar -czf princess-${{ matrix.platform }}.tar.gz -C build .
      - uses: actions/upload-artifact@v4
        with:
          name: princess-${{ matrix.platform }}
          path: princess-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
