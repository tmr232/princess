name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Validate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-notes.ts "$RELEASE_TAG" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: notes
    uses: ./.github/workflows/build.yml

  release:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: princess-*
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" binaries/*.tar.gz \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file notes/release-notes.md "${args[@]}"
